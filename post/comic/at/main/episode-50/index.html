<script>
(function() {
    const songs = [
        { title: "Monster", file: "https://pub-a969d40e123a4a47ae13e2ddb57c2ca6.r2.dev/music/01-Monster.flac", cover: "https://pub-a969d40e123a4a47ae13e2ddb57c2ca6.r2.dev/music/covers/cover1.jpg" },
        { title: "True Kinda Love", file: "https://pub-a969d40e123a4a47ae13e2ddb57c2ca6.r2.dev/music/02-True-Kinda-Love.mp3", cover: "https://pub-a969d40e123a4a47ae13e2ddb57c2ca6.r2.dev/music/covers/cover2.jpg" },
        { title: "Not Just Your Little Girl", file: "https://pub-a969d40e123a4a47ae13e2ddb57c2ca6.r2.dev/music/03-Not-Just-Your-Little-Girl.flac", cover: "https://pub-a969d40e123a4a47ae13e2ddb57c2ca6.r2.dev/music/covers/cover3.jpg" },
        { title: "Haven't You Noticed (I'm a Star)", file: "https://pub-a969d40e123a4a47ae13e2ddb57c2ca6.r2.dev/music/04-Haven't-You-Noticed.flac", cover: "https://pub-a969d40e123a4a47ae13e2ddb57c2ca6.r2.dev/music/covers/cover4.jpg" },
        { title: "Everything Stays", file: "https://pub-a969d40e123a4a47ae13e2ddb57c2ca6.r2.dev/music/05-Everything-Stays.flac", cover: "https://pub-a969d40e123a4a47ae13e2ddb57c2ca6.r2.dev/music/covers/cover5.jpg" },
        { title: "Fries", file: "https://pub-a969d40e123a4a47ae13e2ddb57c2ca6.r2.dev/music/06-Fries.flac", cover: "https://pub-a969d40e123a4a47ae13e2ddb57c2ca6.r2.dev/music/covers/cover6.jpg" },
        { title: "I'm Just Your Problem", file: "https://pub-a969d40e123a4a47ae13e2ddb57c2ca6.r2.dev/music/07-I'm-Just-Your-Problem.flac", cover: "https://pub-a969d40e123a4a47ae13e2ddb57c2ca6.r2.dev/music/covers/cover7.jpg" },
		{ title: "No Big Deal", file: "https://pub-a969d40e123a4a47ae13e2ddb57c2ca6.r2.dev/music/10-No-Big-Deal.flac", cover: "https://pub-a969d40e123a4a47ae13e2ddb57c2ca6.r2.dev/music/covers/cover10.jpg" },
		{ title: "otherside", file: "https://pub-a969d40e123a4a47ae13e2ddb57c2ca6.r2.dev/music/11-otherside.flac", cover: "https://pub-a969d40e123a4a47ae13e2ddb57c2ca6.r2.dev/music/covers/cover1.jpg" },
		{ title: "Just the Two of Us(Acoustic)", file: "https://pub-a969d40e123a4a47ae13e2ddb57c2ca6.r2.dev/music/12-Just-the-Two-of Us(Acoustic).flac", cover: "https://pub-a969d40e123a4a47ae13e2ddb57c2ca6.r2.dev/music/covers/cover1.jpg" },
    ];

    let currentIndex = 0;
    let audio = new Audio();
    let isPlaying = false;

    const coverImg = document.getElementById('sidebarPlayerCover');
    const titleEl = document.getElementById('sidebarPlayerTitle');
    const playPauseBtn = document.getElementById('sidebarPlayPauseBtn');
    const prevBtn = document.getElementById('sidebarPrevBtn');
    const nextBtn = document.getElementById('sidebarNextBtn');
    const progressSlider = document.getElementById('sidebarProgress');
    const currentTimeSpan = document.getElementById('sidebarCurrentTime');
    const durationSpan = document.getElementById('sidebarDuration');
    const volumeSlider = document.getElementById('sidebarVolume');

    function formatTime(seconds) {
        if (isNaN(seconds)) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function loadSong(index) {
        const song = songs[index];
        audio.src = song.file;
        titleEl.textContent = song.title;
        coverImg.src = song.cover;
        progressSlider.value = 0;
        currentTimeSpan.textContent = '0:00';
        durationSpan.textContent = '0:00';
    }

    function updatePlayPauseButton() {
        playPauseBtn.textContent = isPlaying ? '⏸' : '⏵';
    }

    function play() {
        audio.play();
        isPlaying = true;
        updatePlayPauseButton();
    }
    function pause() {
        audio.pause();
        isPlaying = false;
        updatePlayPauseButton();
    }
    function togglePlay() {
        isPlaying ? pause() : play();
    }
    function next() {
        currentIndex = (currentIndex + 1) % songs.length;
        loadSong(currentIndex);
        if (isPlaying) play();
    }
    function prev() {
        currentIndex = (currentIndex - 1 + songs.length) % songs.length;
        loadSong(currentIndex);
        if (isPlaying) play();
    }

    playPauseBtn.addEventListener('click', togglePlay);
    nextBtn.addEventListener('click', next);
    prevBtn.addEventListener('click', prev);

    audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressSlider.value = percent;
            currentTimeSpan.textContent = formatTime(audio.currentTime);
            durationSpan.textContent = formatTime(audio.duration);
        }
    });
    progressSlider.addEventListener('input', (e) => {
        const seekTime = (e.target.value / 100) * audio.duration;
        audio.currentTime = seekTime;
    });

    volumeSlider.addEventListener('input', (e) => {
        audio.volume = parseFloat(e.target.value);
    });
    audio.volume = 0.5;

    audio.addEventListener('ended', next);

    loadSong(0);
})();

document.addEventListener('DOMContentLoaded', function() {
    var coverImage = document.querySelector('.article-image');
    if (coverImage) {
        coverImage.style.display = 'none';
    }
});
</script>

        <script>
        (function() {
            const FONTS = ['MyPixelFont', 'MaokenAssortedSans', 'ChillRoundGothic'];
            const STORAGE_KEY = 'selectedFontIndex';
            function applyFont(fontName) {
                let styleEl = document.getElementById('dynamic-font-override');
                if (!styleEl) {
                    styleEl = document.createElement('style');
                    styleEl.id = 'dynamic-font-override';
                    document.head.appendChild(styleEl);
                }
                styleEl.innerHTML = '* { font-family: ' + fontName + ' !important; }';
                localStorage.setItem(STORAGE_KEY, FONTS.indexOf(fontName).toString());
            }
            function getSavedIndex() {
                const saved = localStorage.getItem(STORAGE_KEY);
                return saved ? parseInt(saved) : 0;
            }
            function bindEmoji() {
                const emoji = document.querySelector('.site-avatar .emoji');
                if (emoji) {
                    emoji.addEventListener('click', (e) => {
                        e.preventDefault();
                        const next = (getSavedIndex() + 1) % FONTS.length;
                        applyFont(FONTS[next]);
                    });
                } else { setTimeout(bindEmoji, 500); }
            }
            applyFont(FONTS[getSavedIndex()]);
            bindEmoji();
        })();
        </script>

            let isShowing = false, timeoutId = null, dialog = null;
            function hideDialog(immediate = false) {
                if (!isShowing) return;
                if (timeoutId) clearTimeout(timeoutId);
                if (immediate) {
                    if (dialog) { dialog.style.opacity = '0'; dialog.style.display = 'none'; }
                    isShowing = false;
                } else {
                    if (dialog) dialog.style.opacity = '0';
                    setTimeout(() => { if (dialog && dialog.style.opacity === '0') { dialog.style.display = 'none'; isShowing = false; } }, 300);
                }
            }
            function initDialog() {
                const avatarLink = document.querySelector('.site-avatar a');
                if (!avatarLink) return;
                if (!dialog) {
                    dialog = document.createElement('div');
                    dialog.id = 'creamy-dialog';
                    dialog.className = 'creamy-dialog';
                    document.body.appendChild(dialog);
                }
                function showDialog(e) {
                    e.preventDefault();
                    if (isShowing) return;
                    const randomMsg = introMessages[Math.floor(Math.random() * introMessages.length)];
                    dialog.textContent = randomMsg;
                    const avatarRect = avatarLink.getBoundingClientRect();
                    const scrollTop = window.scrollY || document.documentElement.scrollTop;
                    const scrollLeft = window.scrollX || document.documentElement.scrollLeft;
                    let left = avatarRect.left + scrollLeft + CONFIG.offsetX;
                    let top = avatarRect.top + scrollTop + CONFIG.offsetY;
                    dialog.style.display = 'block';
                    dialog.style.opacity = '0';
                    const dialogRect = dialog.getBoundingClientRect();
                    const dialogWidth = dialogRect.width;
                    const dialogHeight = dialogRect.height;
                    dialog.style.display = 'none';
                    if (left + dialogWidth > document.documentElement.scrollWidth) left = document.documentElement.scrollWidth - dialogWidth - 10;
                    if (left < 10) left = 10;
                    if (top < 10) top = avatarRect.top + scrollTop + avatarRect.height + 5;
                    if (top + dialogHeight > window.innerHeight + scrollTop) top = avatarRect.top + scrollTop - dialogHeight - 5;
                    dialog.style.left = left + 'px';
                    dialog.style.top = top + 'px';
                    dialog.style.display = 'block';
                    dialog.style.opacity = '1';
                    isShowing = true;
                    timeoutId = setTimeout(() => { hideDialog(false); timeoutId = null; }, CONFIG.duration);
                }
                avatarLink.addEventListener('click', showDialog);
                if (CONFIG.clickOutsideClose) {
                    document.addEventListener('click', function(e) {
                        if (!avatarLink.contains(e.target) && isShowing) hideDialog(false);
                    });
                }
            }
                        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initDialog);
            else initDialog();
