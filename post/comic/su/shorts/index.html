<script>
    
    const comicsData = [
    ];

    function unquote(str) {
        if (typeof str !== 'string') return str;
        return str.replace(/^"|"$/g, '');
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function renderComicList() {
        const listEl = document.getElementById('comicList');
        if (!listEl) return;
        listEl.innerHTML = '';
        comicsData.forEach(comic => {
            const li = document.createElement('li');
            const link = document.createElement('a');
            link.href = '#';
            link.className = 'comic-link';
            link.textContent = unquote(comic.title);
            link.setAttribute('data-id', comic.id);
            link.addEventListener('click', (e) => {
                e.preventDefault();
                showComicFullView(comic.id);
                setActiveHighlight(comic.id);
            });
            li.appendChild(link);
            listEl.appendChild(li);
        });
    }

    function setActiveHighlight(comicId) {
        document.querySelectorAll('.comic-link').forEach(link => {
            if (link.getAttribute('data-id') === comicId) {
                link.classList.add('active-comic');
            } else {
                link.classList.remove('active-comic');
            }
        });
    }

    function createCoverElement(coverPath) {
        const container = document.createElement('div');
        container.style.width = '100%';
        container.style.height = '100%';
        container.style.display = 'flex';
        container.style.alignItems = 'center';
        container.style.justifyContent = 'center';
        
        let cleanPath = unquote(coverPath);
        if (cleanPath && cleanPath.trim()) {
            const img = document.createElement('img');
            img.src = cleanPath;
            img.style.maxWidth = '100%';
            img.style.maxHeight = '120px';
            img.style.objectFit = 'contain';
            img.style.borderRadius = '8px';
            img.style.boxShadow = '0 2px 6px rgba(0,0,0,0.2)';
            img.onerror = () => {
                container.innerHTML = '<div style="font-size:2rem;">📖</div>';
            };
            container.appendChild(img);
        } else {
            container.innerHTML = '<div style="font-size:2rem;">📖</div>';
        }
        return container;
    }

    let currentCategoryIndex = 0;
    let currentComicId = null;

    function renderChaptersGrid(categories, catIndex) {
        const gridContainer = document.getElementById('chaptersGrid');
        if (!gridContainer) return;
        const category = categories[catIndex];
        if (!category || !category.chapters || category.chapters.length === 0) {
            gridContainer.innerHTML = '<div class="notice-msg">✨ 该分类下暂无章节 ✨</div>';
            return;
        }
    
        
        const sortedChapters = [...category.chapters].sort((a, b) => {
            
            const getNum = (link) => {
                const match = link.match(/episode-(\d+)/);
                return match ? parseInt(match[1], 10) : 0;
            };
            const numA = getNum(unquote(a.link));
            const numB = getNum(unquote(b.link));
            return numA - numB;
        });
    
        let buttonsHtml = '<div class="chapters-grid-layout">';
        sortedChapters.forEach(chap => {
            const cleanTitle = unquote(chap.title);
            let url = unquote(chap.link);
            if (!url || url === '') {
                url = `/post/comic/${currentComicId}/${category.baseName}/episode-${Date.now()}/`;
            }
            buttonsHtml += `<a href="${url}" class="chapter-btn" target="_self">${escapeHtml(cleanTitle)}</a>`;
        });
        buttonsHtml += '</div>';
        gridContainer.innerHTML = buttonsHtml;
    }

    function showComicFullView(comicId) {
        const comic = comicsData.find(c => c.id === comicId);
        if (!comic) return;
        currentComicId = comicId;

        const cleanTitle = unquote(comic.title);
        const cleanDesc = unquote(comic.description);
        const cleanKaomoji = unquote(comic.kaomoji);
        const cleanCover = unquote(comic.cover);

        let categoriesHtml = '';
        if (comic.categories && comic.categories.length > 0) {
            categoriesHtml = `<div class="category-tabs" id="categoryTabs">
                ${comic.categories.map((cat, idx) => `
                    <button class="category-btn ${idx === currentCategoryIndex ? 'active' : ''}" data-cat-index="${idx}">
                        ${escapeHtml(unquote(cat.name))}
                    </button>
                `).join('')}
            </div>`;
        } else {
            categoriesHtml = `<div class="notice-msg">暂无分类</div>`;
        }

        const rightArea = document.getElementById('rightArea');
        rightArea.innerHTML = `
            <div class="detail-view">
                <div class="detail-header">
                    <div class="comic-cover" id="dynamicCover"></div>
                    <div class="comic-title-detail">${escapeHtml(cleanTitle)}</div>
                </div>
                <div class="comic-description">
                    📖 简介：${escapeHtml(cleanDesc) || '暂无简介'}
                </div>
                <div class="kaomoji">
                    ✨ ${escapeHtml(cleanKaomoji) || '・ω・'} ✨
                </div>
            </div>
            <div class="folder-view" style="margin-top:20px;">
                <h4>📂 章节列表</h4>
                ${categoriesHtml}
                <div id="chaptersGrid" class="chapters-grid"></div>
            </div>
        `;

        const coverContainer = document.getElementById('dynamicCover');
        if (coverContainer) {
            coverContainer.innerHTML = '';
            coverContainer.appendChild(createCoverElement(cleanCover));
        }

        if (comic.categories && comic.categories.length > 0) {
            currentCategoryIndex = 0;
            renderChaptersGrid(comic.categories, currentCategoryIndex);
            const btns = document.querySelectorAll('.category-btn');
            btns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = parseInt(btn.getAttribute('data-cat-index'));
                    if (!isNaN(idx) && idx !== currentCategoryIndex) {
                        currentCategoryIndex = idx;
                        btns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        renderChaptersGrid(comic.categories, currentCategoryIndex);
                    }
                });
            });
        } else {
            const gridContainer = document.getElementById('chaptersGrid');
            if (gridContainer) gridContainer.innerHTML = '<div class="notice-msg">没有找到章节，请检查目录结构</div>';
        }
    }

    renderComicList();
    if (comicsData.length) {
        showComicFullView(comicsData[0].id);
        setActiveHighlight(comicsData[0].id);
    }

    
    (function() {
        const win = document.querySelector('.comic-window');
        if (!win) return;
        const bar = win.querySelector('.window-bar');
        if (!bar) return;

        
        try {
            const savedLeft = localStorage.getItem('comicWindowLeft');
            const savedTop = localStorage.getItem('comicWindowTop');
            if (savedLeft !== null && savedTop !== null) {
                win.style.position = 'fixed';
                win.style.margin = '0';
                win.style.left = savedLeft + 'px';
                win.style.top = savedTop + 'px';
                win.style.maxWidth = 'none';
                win.style.width = win.offsetWidth + 'px';
                win.style.zIndex = '9999';
            }
        } catch(e) {}

        let isDragging = false;
        let offsetX, offsetY;

        bar.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            if (e.target.closest('.win-controls')) return;
            e.preventDefault();

            const rect = win.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;

            if (win.style.position !== 'fixed') {
                win.style.position = 'fixed';
                win.style.margin = '0';
                win.style.left = rect.left + 'px';
                win.style.top = rect.top + 'px';
                win.style.maxWidth = 'none';
                win.style.width = rect.width + 'px';
                win.style.zIndex = '9999';
            }
            isDragging = true;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            let newLeft = e.clientX - offsetX;
            let newTop = e.clientY - offsetY;

            newTop = Math.max(0, newTop);   
            win.style.left = newLeft + 'px';
            win.style.top = newTop + 'px';
        });

        window.addEventListener('mouseup', () => {
            if (isDragging) {
                try {
                    localStorage.setItem('comicWindowLeft', parseFloat(win.style.left));
                    localStorage.setItem('comicWindowTop', parseFloat(win.style.top));
                } catch(e) {}
                isDragging = false;
            }
        });
    })();
</script>

        <script>
        (function() {
            const FONTS = ['MyPixelFont', 'MaokenAssortedSans', 'ChillRoundGothic'];
            const STORAGE_KEY = 'selectedFontIndex';
            function applyFont(fontName) {
                let styleEl = document.getElementById('dynamic-font-override');
                if (!styleEl) {
                    styleEl = document.createElement('style');
                    styleEl.id = 'dynamic-font-override';
                    document.head.appendChild(styleEl);
                }
                styleEl.innerHTML = '* { font-family: ' + fontName + ' !important; }';
                localStorage.setItem(STORAGE_KEY, FONTS.indexOf(fontName).toString());
            }
            function getSavedIndex() {
                const saved = localStorage.getItem(STORAGE_KEY);
                return saved ? parseInt(saved) : 0;
            }
            function bindEmoji() {
                const emoji = document.querySelector('.site-avatar .emoji');
                if (emoji) {
                    emoji.addEventListener('click', (e) => {
                        e.preventDefault();
                        const next = (getSavedIndex() + 1) % FONTS.length;
                        applyFont(FONTS[next]);
                    });
                } else { setTimeout(bindEmoji, 500); }
            }
            applyFont(FONTS[getSavedIndex()]);
            bindEmoji();
        })();
        </script>

                    dialog.style.display = 'none';
                    if (left + dialogWidth > document.documentElement.scrollWidth) left = document.documentElement.scrollWidth - dialogWidth - 10;
                    if (left < 10) left = 10;
                    if (top < 10) top = avatarRect.top + scrollTop + avatarRect.height + 5;
                    if (top + dialogHeight > window.innerHeight + scrollTop) top = avatarRect.top + scrollTop - dialogHeight - 5;
                    dialog.style.left = left + 'px';
                    dialog.style.top = top + 'px';
                    dialog.style.display = 'block';
                    dialog.style.opacity = '1';
                    isShowing = true;
                    timeoutId = setTimeout(() => { hideDialog(false); timeoutId = null; }, CONFIG.duration);
                }
                avatarLink.addEventListener('click', showDialog);
                if (CONFIG.clickOutsideClose) {
                    document.addEventListener('click', function(e) {
                        if (!avatarLink.contains(e.target) && isShowing) hideDialog(false);
                    });
                }
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initDialog);
            else initDialog();
        })();
        </script>
    </body>
</html>
